# qits-platform-mirror — the platform's pull-through caches.
#
# This module is the deployable, so this file is read at ordinal 250: it is the app's own settings.
# The library jars ship their defaults at ordinal 100 in META-INF/microprofile-config.properties
# (qits-blobstore: the blob directory and the grace period; qits-registries-{npm,maven,oci}: each
# format's caps, TTLs and upstream). Anything restated here is restated because THIS service owns
# the decision, not because the default was wrong. A deployment still overrides any of it by env.

quarkus.application.name=qits-platform-mirror

# Quarkus' non-application root — health, and nothing else this service serves. It sits under a
# segment of its own so the prefix-routing gateway can reach it: /mirror/q/health/ready.
#
# THE PROTOCOL ROUTES DO NOT FOLLOW IT, and cannot. They are plain Vert.x routes whose prefixes are
# literals in the qits-registries jars — /artifacts/npm, /artifacts/maven and /v2 — so this service
# answers npm and maven on the SAME paths qits-artifacts does, and OCI at the host root like every
# registry. Two services cannot both be /artifacts/* behind one gateway entry; splitting the client
# config (npm scoped registries, dockerd registry-mirrors, the maven repositories list) is what the
# plan's cutover phase does, and moving the npm/maven literals off /artifacts is a qits-registries
# change that has not been made. Recorded here so nobody discovers it during a cutover.
quarkus.http.non-application-root-path=/mirror/q

# The JAX-RS prefix. THE ADMIN API IS THE ONLY JAX-RS SURFACE HERE and it is deliberately small: two
# read-only listings, /mirror/api/repositories and /mirror/api/upstreams, which the explorer draws.
# Everything else this service serves is still a wire protocol on a raw Vert.x route in a library
# jar — the API is what makes those caches visible, not another way into them.
#
# There is no write. What this service holds is decided by what somebody pulled and what it drops is
# decided by the eviction windows below; a route that evicted on demand would be a second policy with
# no record of why it ran.
#
# A FAILED READ IS A 5xx, NEVER AN EMPTY ANSWER — the rule the datasource block below is also about,
# and the one this service is the worst place on the platform to break. An unmapped exception out of
# a resource is a 500, so the API is correct by not catching anything; see MirrorExplorer, which is
# where that is written down and where DbRetry wraps the reads.
quarkus.rest.path=/mirror/api

# --- the explorer ---------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-platform-spa-mirror submodule, an Angular SPA) during
# augmentation and serves the output as static resources. Three surfaces on one port and one gateway
# segment: /mirror is the SPA, /mirror/api is JAX-RS, /mirror/q is Quarkus' own.
#
# ui-root-path is the segment itself. It is spelled here AND as Angular's baseHref in the submodule's
# angular.json ("/mirror/") — Quinoa mounts the files, the baseHref is what makes index.html ask for
# them at the right url, and a mismatch serves a page whose every asset 404s with nothing on this
# side to notice.
quarkus.quinoa.ui-root-path=/mirror

# Deep links: /mirror/upstreams has no file behind it, so without this a reload or a pasted link 404s
# and only the entry page works.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa can derive this from the client's angular.json, but it derives it from a
# project NAME — pinning it means a rename over there fails this build ("Quinoa build directory not
# found") rather than resolving somewhere stale.
quarkus.quinoa.build-dir=dist/qits-platform-spa-mirror/browser

# WHAT THE SPA FALLBACK MUST NOT SWALLOW. The re-route is a late-order catch-all: anything with a
# real route in front of it still wins, but a request matching NO route is rerouted to index.html and
# answers 200 text/html. For a browser that is a mild wart; for the clients this service exists to
# serve it is the expensive failure — a mistyped packument url parsed as JSON, a maven client
# reporting a corrupt jar, a docker client seeing no Docker-Distribution-Api-Version header. And a
# wrong answer here does not stay wrong once: it is cached by every client that asked.
#
# Setting this key REPLACES Quinoa's derivation rather than extending it, and the derivation is
# quarkus.rest.path + quarkus.http.non-application-root-path — so /api and /q have to be repeated by
# hand, and cannot be written as ${quarkus.rest.path} because the values are matched AFTER
# ui-root-path is stripped. That is the trap that hides: an absolute value matches nothing and is
# indistinguishable from an unset key.
#
#   /api  the admin API (quarkus.rest.path), post-strip
#   /q    health (quarkus.http.non-application-root-path), post-strip
#
# THE PAIR IS THE WHOLE LIST, and the three protocol roots are deliberately NOT in it. Quinoa
# registers the fallback at exactly `ui-root-path + "*"` — /mirror/* and nothing else — and every
# entry here is resolved relative to that same root, so /artifacts/npm, /artifacts/maven and /v2 are
# both out of the fallback's reach and unnameable from this key: written here they would guard the
# nonsense shapes /mirror/artifacts/npm and /mirror/v2. qits-artifacts' /v2 entry is not a
# counter-example, it is this rule — its list is relative too, so that entry means /artifacts/v2, a
# guard against a misroute UNDER its segment.
#
# MEASURED on this service's packaged fast-jar, 2026-08-11, with the list cut to this pair:
# /v2/<nonsense>, /artifacts/npm/<nonsense> and /artifacts/maven/<nonsense> each answered 404 from
# their own router — application/json, application/json and text/plain, never index.html — while
# /mirror/api/nope answered 404 and /mirror/<deep link> still fell back to the SPA. The list is the
# derivation, spelled out because spelling it is what makes the next literal route's entry a diff.
quarkus.quinoa.ignored-path-prefixes=/api,/q

# quarkus.quinoa.package-manager-install is deliberately NOT here. A local or CI mvnw build uses the
# node on PATH, so no build silently downloads a toolchain; the two install flags appear only in
# docker/Dockerfile's builder stage, which ships no node at all. A machine with no node fails at
# Quinoa's npm invocation, and the fix is node on PATH.
#
# Quinoa is also disabled by default in TEST mode and is left that way. A @QuarkusTest asserting
# anything about /mirror/ would pass against a process with no client in it, so what the SPA is
# actually served as is proved against the packaged artifact and nowhere else.

# --- the type registration, narrowed to caches --------------------------------------------------
# THE ONE LINE THAT MAKES THIS A MIRROR RATHER THAN A SECOND ARTIFACTS.
#
# Each qits-registries module carries BOTH sides of its format — hosted and cache — because they
# share a table and a set of routes and are told apart by the repository row's type. So the hosted
# profile beans arrive on the classpath whether this service wants them or not, and a registered
# profile is a type a repository row may legally carry.
#
# Excluding them from bean discovery is what makes "the mirror owns only caches" true rather than
# merely intended: RepositoryTypeProfiles then indexes exactly three keys, ArtifactRepositoryService
# .ensure answers a request for any other with a 400 naming what IS registered, and the schema's
# ck_artifact_repository_type lists those same three. The set the code enforces and the set the
# database accepts are one set — which is the property that makes either of them worth having.
#
# Nothing injects these beans (every reference in the libraries is to their static KEY constant), so
# removing them costs no wiring. CI_SCREENSHOTS and CI_VIDEOS go for the same reason as the three
# hosted ones: they are qits-artifacts' types, and this service has no upload path to enforce them
# on.
quarkus.arc.exclude-types=eu.wohlben.qits.artifacts.control.CiScreenshotsProfile,eu.wohlben.qits.artifacts.control.CiVideosProfile,eu.wohlben.qits.artifacts.control.NpmPackagesProfile,eu.wohlben.qits.artifacts.control.MavenPackagesProfile,eu.wohlben.qits.artifacts.control.OciImagesProfile

# --- the store ----------------------------------------------------------------------------------
# This context owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing qits-artifacts' or anyone else's.
#
# WHERE THE DATABASE COMES FROM. qits-platform-deployments creates the role and the database on the
# tier's postgres before the successor container starts and injects the platform's generic resource
# contract — QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD — into it. Nothing about those names is
# mirror-specific, which is the point: the application maps them in its own config and the deployer
# stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable rather than opening some fallback store nobody meant.
quarkus.datasource.mirror.db-kind=postgresql
quarkus.datasource.mirror.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.mirror.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.mirror.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# The driver line is the third of the platform's baseline and the one that makes a request WAIT
# instead of fail: PatientPgDriver delegates to org.postgresql.Driver and, when the database is not
# there, keeps asking for up to 14s — under the 15s above, so a caller that outlasts it gets the
# database's real refusal rather than a generic acquisition timeout. It retries only "not there"
# (SQLState 08*, and 57P03 while postgres is starting up); a wrong password fails at once. It costs
# this service more than latency to skip: a failed catalog read that surfaces as "no such artifact"
# is cached by every docker and maven client that asked. All three lines or none, and
# DatasourceBaselineTest fails the build if one goes missing.
quarkus.datasource.mirror.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.mirror.jdbc.acquisition-timeout=15S
quarkus.datasource.mirror.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to it. `packages` assigns entity→PU unambiguously: every entity
# this service maps arrives from a library jar under eu.wohlben.qits.artifacts.entity (the blob core
# and all three formats share the package), and without this line an entity in a service with no
# DEFAULT datasource has no unit to belong to and the boot fails naming neither.
quarkus.hibernate-orm.mirror.datasource=mirror
quarkus.hibernate-orm.mirror.packages=eu.wohlben.qits.artifacts.entity

# PostgreSQL, with one difference: a `@Lob String` is an ordinary `text` column rather than a large
# object. Three library entities carry one — the cached packument, the cached npm manifest and the
# cached maven-metadata.xml — and Hibernate's default CLOB binding on PostgreSQL is a LOB LOCATOR,
# which the driver refuses to read outside a transaction. Serving a cached document is a read with no
# write, so every one of them would 500 with "Large Objects may not be used in auto-commit mode".
# See the dialect class; it is four lines and its javadoc is the whole argument.
quarkus.hibernate-orm.mirror.dialect=eu.wohlben.qits.mirror.MaterializedClobPostgreSQLDialect

# Own Flyway lineage at a classpath location named after the context. V1 is a fresh baseline, NOT a
# copy of qits-artifacts' thirteen migrations: the libraries carry no migrations by design, each
# consuming service owns its schema, and this one starts empty (byte-plane-split-plan.md phase 1).
#
# baseline-on-migrate is deliberately absent. Every database this lineage meets is either empty or
# was created by this lineage, so the flag would only mask the one case worth failing on — a schema
# somebody else put there.
quarkus.flyway.mirror.migrate-at-start=true
quarkus.flyway.mirror.locations=classpath:db/mirror/migration

# Blob content lives on disk beside the metadata rows, content-addressed. Restated over the
# blobstore jar's default so a developer running this and qits-artifacts on one machine does not
# have the two services sharing a directory: the stores are content-addressed and would not corrupt
# each other, but each one's reclaim sweep would see the other's files as unreferenced.
qits.artifacts.blobs-dir=${user.home}/.qits/data/mirror/blobs

# --- what this service is a cache OF ------------------------------------------------------------
# The three upstreams, spelled here because they are this service's whole identity. npm and maven
# are one key each; OCI is a TABLE (oci_mirror_upstream), because which registries are mirrored has
# a CRUD surface and a UI while a config key is invisible — see V1's prefill for the three it ships
# with, and MirrorEndpoints for the docker.io -> registry-1.docker.io hop every client hardcodes.
qits.artifacts.npm.proxy.upstream=https://registry.npmjs.org
qits.artifacts.maven.proxy.upstream=https://repo1.maven.org/maven2

# WHERE an upstream is dialled, overriding the derivation from its domain. Blank in every
# deployment: it exists so a suite can point the miss path at an in-process stub with no network and
# no second code path. Blank is also why MirrorUpstream injects it as Optional<String> — SmallRye
# reads a configured-empty value as ABSENT, so a plain String injection would fail the packaged
# boot while every test, which sets a real value, stayed green.
qits.artifacts.oci.mirror.endpoint-override=

# --- cache eviction -----------------------------------------------------------------------------
# WHAT KEEPS A CACHE FROM GROWING FOREVER. Every byte here came from upstream and can be fetched
# again, so the only question worth asking of an entry is whether anything still uses it: an identity
# unaccessed for longer than its type's window is evicted, and its blobs are reclaimed once no
# surviving row of any type names them.
#
# There is no route and no button. The policy is these keys, and the only trigger is the clock.
qits.mirror.eviction.enabled=true

# Plan and report, delete nothing. Shipped FALSE: the sweep withholds anything whose blob file is
# younger than qits.artifacts.gc.blob-grace-period, so a fresh deployment's first runs are no-ops on
# their own. A deployment that wants to watch the counts for a week sets this to true.
qits.mirror.eviction.dry-run=false

# 03:20 every night, local time. Off-hours because a run reads every cached row and parses every
# manifest document, and a cron rather than an interval so two deployments do not drift into
# sweeping at the busiest minute of somebody's build.
qits.mirror.eviction.cron=0 20 3 * * ?

# The windows, per type wire name — the spelling every report and repository listing uses.
#
# npm and OCI get P30D: an npm install and a docker pull are things that happen on a build's cadence,
# and a month of nobody wanting a package or a tag is the honest signal that a re-download costs less
# than the disk. maven gets P90D because a library is resolved when something builds AGAINST it, and
# that cadence is not a month — a dependency behind a release train that runs twice a year survives
# on its next build and is re-fetched if it does not.
#
# A type with no window here does not fall back to a number: it fails its line in the run and is
# skipped whole, because guessing a window is guessing what may be deleted.
qits.mirror.eviction.window.npm-proxy=P30D
qits.mirror.eviction.window.maven-proxy=P90D
qits.mirror.eviction.window.oci-mirror=P30D

# --- the wire body ceiling ----------------------------------------------------------------------
# Sized ABOVE qits.artifacts.oci.max-layer-size (1G, from the oci jar) on purpose. Were the two
# equal the wire 413 would always win — Quarkus' VertxInputStream compares bytesRead(), which runs
# ahead of what BlobStore has consumed — and the client would get an empty-bodied 413 with the
# connection reset instead of the OCI error envelope that explains itself.
#
# 1088M = 1 GiB + 64M slack, the same number qits-artifacts ships. It is a literal because config
# expressions cannot express a max().
quarkus.http.limits.max-body-size=1088M

# Vert.x' BlockedThreadChecker logs a warning WITH A FULL STACK TRACE whenever an executeBlocking
# task outruns quarkus.vertx.max-worker-execute-time, which defaults to 60 seconds. It aborts
# nothing — but a layer streamed in from an upstream holds its worker for as long as the fetch
# takes, and a gigabyte is minutes on any link worth calling slow, so the default turns every cold
# `docker pull` into a wall of stack traces that buries real warnings.
#
# ISO-8601 rather than a bare number, which Quarkus reads as seconds. What bounds a stalled transfer
# instead is qits.artifacts.oci.mirror.blob-timeout.
quarkus.vertx.max-worker-execute-time=PT30M

# gzip on the way out. It has to be HERE and not in a deployment's environment: the key is
# BUILD_AND_RUN_TIME_FIXED, so an env var on the container is read, accepted and ignored with no
# warning anywhere.
#
# quarkus.http.compress-media-types is deliberately LEFT UNSET. Setting it REPLACES Quarkus' default
# list rather than adding to it, and the default list is already what we want: packuments and maven
# metadata are JSON and XML, while layers, tarballs and manifests-by-digest are already-compressed
# bytes served with sendFile that re-compressing would cost CPU to grow.
quarkus.http.enable-compression=true

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-platform-mirror` rather than qits-platform-mirror-<version>-runner, so
# the process is identifiable in `ps` / `docker top`.
quarkus.package.output-name=qits-platform-mirror
quarkus.package.jar.add-runner-suffix=false

# --- telemetry ----------------------------------------------------------------------------------
# One key names the receiver: scheme, host and port, NO path. The ingest path is qits-observability's
# own and belongs to the service, so it is spelled once and derived rather than configured.
qits.observability.url=http://qits-observability:8080
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs and metrics ride the same exporter; traces are on by default. The three log keys are spelled
# out although two of them are Quarkus' own defaults: the integration is still labelled PREVIEW, so
# an upgrade that changed a default would stop this service's logging with a green build and no
# error anywhere. Written down, a change of default is a diff rather than a silence.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
