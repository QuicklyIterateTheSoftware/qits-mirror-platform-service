# TEST-ONLY OVERRIDES. Nothing else belongs in this file.
#
# Quarkus MERGES src/main/resources/application.properties into the test config — it is not shadowed
# by this file. So every app-level setting (the application name, the arc exclusions, the persistence
# unit, the flyway location) is already in effect here and must NOT be re-declared: a test copy that
# drifts from the shipped copy makes the suite pass on a value the packaged process never sees.
# Only put a key here when the test genuinely needs a DIFFERENT value, and say why.

# The suite runs against a REAL POSTGRES — zonky binaries spawned as a child process, never a
# container. Its url, username and password are not written here at all: the port is chosen at run
# time, so EmbeddedPgConfigSource supplies the triple at ordinal 500, overriding the unresolvable
# QITS_RESOURCE_DB_* expressions the shipped config carries.
#
# clean-at-start wipes the schema between Quarkus restarts — this module has one @TestProfile per
# format, so the application restarts several times against one database — and the V1 prefill is
# re-applied by the migrate that follows, which is what keeps the three mirror namespaces present in
# every profile.
quarkus.flyway.mirror.clean-at-start=true

# NO DEV SERVICES. The first rule here is that a clone tests green with no docker, and a dev service
# is a container start — which is exactly what an unconfigured postgres datasource invites. The
# config source above always gives this one a url, so nothing should ask; this line is what makes
# "should" into "cannot".
quarkus.devservices.enabled=false

# Port 8081 is the platform npm registry on the build hosts, so never bind a fixed port.
quarkus.http.test-port=0

# NO SCHEDULE. The eviction sweep is the one scheduled thing this service has, and a suite whose
# store is deleted from by a background cron at 03:20 would fail for whoever runs it at 03:20. The
# eviction suites call the run directly, which is the honest place to prove it.
quarkus.scheduler.enabled=false

# The body ceiling and the layer cap, both far below the shipped pair (1088M / 1G): the suite only
# has to exercise the relationship between them, and a test that allocated a gigabyte to prove a 413
# would be measuring the machine.
quarkus.http.limits.max-body-size=64M
qits.artifacts.oci.max-layer-size=32M

# NO NETWORK, on all three upstreams. Every one of them is a REAL public endpoint in the shipped
# config, so without these lines a cold miss in any suite would dial npmjs, Central or Docker Hub for
# real — and would pass or fail for reasons that have nothing to do with this code. A closed port
# refuses at once, which is the honest offline posture; the smoke tests that exercise a miss path
# override their own key per-profile with an in-process stub.
qits.artifacts.npm.proxy.upstream=http://localhost:1
qits.artifacts.maven.proxy.upstream=http://localhost:1
qits.artifacts.oci.mirror.endpoint-override=http://localhost:1

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# THE CATALOGUE DEPENDS ON IT. src/test/java/.../mirror/stories/ is seven story classes sharing one
# @TestProfile, so they are all in one profile group and the secondary orderer is what decides the
# order inside it: CacheInventoryIT declares @UserflowRunsAfter over the three pull-through classes,
# because an inventory is only worth reading once something has been pulled. Without this line that
# edge is ignored, the inventory runs in JUnit's own order and fails for a reason nothing names.
#
# (Order INSIDE a class is a different mechanism and a different file: three classes carry
# @TestMethodOrder because a warm-read story is only warm because a cold one ran, and because a
# cumulative upstream recording is attributed by a cursor. Each says so in its javadoc.)
#
# THIS FILE IS ON THE FAILSAFE JVM'S CLASSPATH, NOT IN THE LAUNCHED ARTIFACT. Everything above is
# read by the @QuarkusTest suites; the story catalogue hands the launched process its whole
# configuration through stories/support/StoryProfile, as -D arguments on an already-built artifact.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
