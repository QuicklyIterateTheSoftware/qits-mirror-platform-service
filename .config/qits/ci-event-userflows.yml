# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# target/userstories/ through PullThroughBootstrapIT — and the reports published as one docs bundle,
# site @userflows/qits-platform-mirror, version = the bare commit sha, branch riding as artifacts
# metadata for discovery.
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-post-receive.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per branch,
# collapsed to the newest tip under burst.
#
# WHAT THE STORIES ARE. This service is the platform's pull-through caches and nothing else, so the
# two stories are the two halves of what a cache promises. The first: a build's first fetch fills the
# cache and the second is served without asking upstream — the index and the tarball both, counted on
# the UPSTREAM's end, because "served from cache" is unfalsifiable without a count of what upstream
# was asked. The second: a no from upstream is passed through and remembered nowhere, while an
# upstream that cannot answer is a 502 and never a 404 — the distinction this service is the worst
# place on the platform to lose, since a wrong "there is no such thing" is cached by every npm, maven
# and docker client that asked.
#
# THE FAR SIDE IS A RECORDING MockService IMPERSONATING registry.npmjs.org — the literal default of
# qits.artifacts.npm.proxy.upstream, so the sequence diagram names the address a deployment really
# dials. The other two upstreams (Maven Central, and the OCI endpoint derived from the seeded
# oci_mirror_upstream rows) are pointed at a closed port by the IT's own @TestProfile: no story
# resolves a jar or pulls an image, and a key left at its shipped value would let a mistyped path
# reach the real internet from a step container, where it would pass or fail for reasons unrelated to
# this code. A MIRROR MUST NOT BUILD THROUGH ITSELF still holds here as everywhere: the Maven
# repository this step reads is qits-artifacts', never this deployment's.
#
# `user: build`, and NOT a switch inside the script. This repository's suite spawns a REAL postgres —
# zonky binaries resolved as ordinary Maven artifacts and run as a child process, never a container —
# and PullThroughBootstrapIT hands the launched artifact one of its own through the platform's
# generic resource triple, because this service's whole state is a database. initdb refuses to run as
# root and calls getpwuid, so the step needs a passwd-backed non-root user: maven-base carries one
# (uid 1001), with cap-drop=ALL and no su to undo it, which nothing here wants. The step containers
# are Alpine (musl), which is why pom.xml now names zonky's -alpine binaries as a FOURTH arch;
# without that entry this run resolves green and dies mid-suite on a missing artifact.
#
# Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
# ignored and npm still runs): the explorer client is ci-post-receive.yml's business, where the
# qits-platform-spa-mirror submodule is initialised and its lockfile origins are swapped against the
# platform's two npm services, and none of that ritual belongs here — the stories assert nothing
# about the SPA. It is also what keeps this step from needing the submodule at all: the daemon's
# clone does not recurse, so src/main/webui arrives EMPTY, and an empty directory is the one case
# Quinoa treats as a misconfiguration rather than as "no client" (`No package.json found in Web UI
# directory`; docker/Dockerfile's `test -f` guard says the same thing from the other side). The
# packaged fast-jar failsafe boots is otherwise exactly what ships.
#
# THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its ITs back in
# from the pom the way qits-docs does. `skipITs` is true in pom.xml and stays true, for two reasons
# either of which would settle it:
#
#   1. THE README OWES A PACKAGED-SURFACE PROBE, and half of it is about the CLIENT — `/` answering
#      200 HTML with <base href="/">, a deep link falling back to index.html, and /v2,
#      /artifacts/npm and /artifacts/maven staying 404s now that the root-path flip put all three
#      inside the SPA fallback's reach. The line above deliberately builds no client, so a blanket
#      -DskipITs=false would make this run red on that test the day it lands.
#   2. THE SUREFIRE SUITE ALREADY SPAWNS A POSTGRES. Opting a plain `mvn verify` into a second one
#      plus a launched process would change the clone-alone build the README documents, for
#      everybody, to run what this pipeline runs anyway.
#
# Naming the class keeps the opt-in to this pipeline and to this story, and keeps the property's own
# meaning ("run everything") intact for the `native` profile that sets it:
# `-DskipITs=false "-Dit.test=PullThroughBootstrapIT"`.
#
# NO REPAIR WAS NEEDED to make the two new test-scope jars resolve. This repository already carries
# `.qits-maven-settings.xml` at its root and a `qits-maven` <repositories> entry — qits-blobstore,
# the three qits-registries jars, qits-db-core and qits-arch-rules have always come from the
# platform registry — so docker/Dockerfile's `-s .qits-maven-settings.xml … package -Dnative
# -DskipTests` resolves qits-userflows and qits-service-mock there exactly as it already resolved
# those. (`-DskipTests` skips test EXECUTION, not test compilation, so both jars are fetched during
# an image build too; qits-userflows' transitive Playwright is a jar, not a browser — nothing
# downloads Chromium unless a story asks for a `Flow`, and neither of these does.) The same holds for
# ci-post-receive.yml and ci-event-release.yml, which build that Dockerfile with `--network host` and
# the Maven repository build arg and needed no edit.
#
# TIMEOUT. Longer than the fleet's usual 2400: this suite restarts Quarkus once per @TestProfile
# across the npm, maven, OCI and eviction classes against a real postgres, and `verify` then packages
# the fast-jar and launches it for the IT. 3600 is headroom, not an expectation.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle. The bundle goes to
# qits-artifacts and is read back by qits-docs, neither of which is this service; the one thing that
# could close a loop is this service's own telemetry, and it cannot, because the story runs against a
# launched process with quarkus.otel.sdk.disabled=true. Publish-if-absent: events redeliver and docs
# versions are immutable, so 409 is success (the qits-spa-ui-components release file's discipline).
event: SCMPublishCommit
when:
  - repoId: { exact: qits-platform-mirror }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 3600
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false "-Dit.test=PullThroughBootstrapIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. SINGLE-MODULE repository, so the path is target/userstories and
      # not the service/target/… most siblings' files name.
      tar -czf userstories.tgz -C target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-platform-mirror" \
        "$QITS_DOCS_URL/@userflows/qits-platform-mirror/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-platform-mirror@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-platform-mirror@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
