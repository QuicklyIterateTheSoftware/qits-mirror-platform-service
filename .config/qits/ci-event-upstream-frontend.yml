# THIS SERVICE FOLLOWS ITS FRONTEND. The client is a repository of its own, released on its own
# train, and embedded here as a submodule at src/main/webui — so a frontend release changes
# nothing until the gitlink in this repository moves. That is what this pipeline does: it fetches
# the released tag, rewrites the gitlink, and pushes the result to `maintenance/frontend`.
#
# THE BRANCH IS AS FAR AS IT GETS HERE. Every sibling platform service carries a
# ci-event-maintenance-release.yml that releases a maintenance/ push; this repository does not have
# one yet, so the bump waits on the branch for a hand release. Copying that file in completes the
# train.
#
# ONE BRANCH, REUSED, force-pushed. Two frontend releases in a row must not leave two branches
# behind; the second replaces the first, and whatever the first did not release is superseded.
#
# The gitlink comparison makes this idempotent: a redelivered event whose tag is already recorded
# exits green without a push.
event: SCMRelease
when:
  - repository: { exact: qits-mirror-platform-frontend }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 600
    script: |
      set -eu
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-mirror-platform-frontend"
      git -c submodule.qits-mirror-platform-frontend.url="$frontend_url" submodule update --init src/main/webui
      git -C src/main/webui fetch "$frontend_url" "refs/tags/$version:refs/tags/$version"
      git -C src/main/webui checkout --detach "$version"
      target=$(git -C src/main/webui rev-parse HEAD)
      current=$(git ls-tree HEAD src/main/webui | awk '{print $3}')
      if [ "$current" = "$target" ]; then exit 0; fi
      git update-index --add --cacheinfo 160000,$target,src/main/webui
      git -c user.name="qits release train" -c user.email="release-train@qits.local" commit -q -m "bump(qits-mirror-platform-frontend@$version): follow qits-mirror-platform-frontend"
      git push --force "$QITS_CI_REPOSITORY_URL" HEAD:refs/heads/maintenance/frontend
