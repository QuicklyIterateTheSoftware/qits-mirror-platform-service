# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# ONE STEP, and that is the whole shape — qits-platform-dns' pipeline, name for name: this service
# serves no page yet (the admin UI is byte-plane-split-plan.md phase 2), so there is nothing to
# install from the platform's npm registry and nothing to prepare in the build context. The
# Dockerfile's builder stage does everything.
#
# THE TWO FLAGS THAT dns DOES NOT NEED. This repository is one application over two library
# repositories — qits-blobstore and qits-registries-{common,npm,maven,oci} — published to the
# platform's own Maven repository and available from nowhere else, so the builder stage has to be
# able to reach it:
#
#   --network host        NOT a custom network: buildkit — the builder format the platform targets,
#                         because a swarm cannot assume the legacy builder — refuses custom networks
#                         on a build. Host networking is buildkit-supported and reaches the
#                         registry's host-published address.
#   --build-arg           names that address, derived from the same injected env the image tag uses,
#                         so no address is stated here. The Dockerfile turns it into
#                         -Dqits.maven.repository.url, which the pom's `qits-maven` repository reads
#                         and .qits-maven-settings.xml mirrors, so a source-only build resolves the
#                         four dependencies that are not on Maven Central.
#
# THE BOOTSTRAP ORDER THIS IMPLIES, and it is worth reading before the first deploy: those jars must
# be RELEASED to the platform's Maven repository before this pipeline can be green. The build cannot
# fall back on a developer's ~/.m2, and this service cannot serve its own build — a mirror's first
# deploy must not depend on itself, so the Maven repository the builder reads is qits-artifacts',
# never this one.
#
# Publish under the tag that is the whole contract with qits-deployments —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true).
#
# `set -eu` is load-bearing rather than tidy: the daemon runs this with `bash -c` and no -e, so
# without it a failed build is swallowed by the next command's exit code — the push fails,
# `docker rmi || true` answers 0, and the run reports SUCCESS. The deployer is then told an image
# exists that does not. -u makes an unset registry variable stop the step too.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-mirror:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      docker rmi "$ref" || true
