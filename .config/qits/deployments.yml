# How qits-deployments deploys this repo. It reads this file from the git host at the built sha, so
# the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is the
# trunk push alone.
#
# PLATFORM service, and the only byte service that stays one. Everything here is a cache of somebody
# else's bytes: npmjs, Maven Central, Docker Hub. A copy per environment would be several caches
# fetching the same tarball from the same upstream and each holding its own disk copy of it, which is
# the opposite of what a pull-through cache is for. One instance, warmed by every environment's
# builds, is the whole reason this service was split out of qits-artifacts
# (byte-plane-split-plan.md).

# THE NAME THIS DEPLOYS AS, spelled because the repository is renamed and the application is not.
# Every derivation the deployer makes hangs off this name — the wire alias peers dial, the container
# it manages, the extras family, the database — so letting it follow the repository would
# decommission the running service and start a stranger beside it.
application: qits-platform-mirror

deployment_target: platform

# One route for this application's machine surface: the admin API at /mirror/api and health at
# /mirror/q. The edge path-routes every application's route prefix on EVERY host, so this one line
# keeps both reachable wherever a reader is. The client itself is no longer under it — it is served
# at / on this application's own host. The three cache roots are not here either: they are reached on
# this application's host directly.
routes: /mirror

# WHERE THIS APPLICATION HANGS IN THE SIDEBAR. `system` is the global group — this service is about
# the platform rather than about one project — and 2 is the position inside it.
#
# The host is not spelled because the derived one is already right: the application name minus its
# `qits-platform-` prefix is `mirror`, which is the label dockerd, npm and maven already dial. The
# browser plane and the machine plane land on the same authority by design, not by accident.
navigation-entries: system.Mirror:2

# A postgres role and database of this application's own, created on the tier's postgres BEFORE the
# successor container starts and injected as QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD.
#
# The database name is not spelled because the default is right: it derives from the application name
# with the `qits-` prefix dropped and dashes turned to underscores, so this asks for
# `qits_platform_mirror`, and a name written out here would be a second copy of one answer.
#
# application.properties maps those three variables onto quarkus.datasource.mirror.* with no defaults
# behind them. Without this line the container has no database and dies at Flyway's migrate-at-start
# naming the missing variable — which is the failure worth having: a cache that invented an empty
# store would answer every lookup as a miss, refetch the internet on every build, and report nothing.
resources: postgresql:db

# THE PROBE THE DEPLOY GATES ON, SPELLED OUT BECAUSE THE DERIVED DEFAULT IS WRONG. The default would
# be /platform-mirror/q/health/ready — the repository name minus `qits-`; this application serves its
# non-application root at /mirror/q (quarkus.http.non-application-root-path), which is the
# application's own name minus the prefix. A derived default is only ever right where the route
# prefix and the served prefix are the same string.
#
# Readiness rather than liveness, and the difference is not cosmetic: quarkus-agroal registers a
# readiness check for the `mirror` datasource as soon as a health extension is present, so this path
# is red while the database asked for above is unreachable. Liveness answers UP with an empty check
# list — a process that boots and cannot read its cache index would pass it, and that container is
# the one this deploy must not promote.
health_path: /mirror/q/health/ready

# WHAT THIS FILE CANNOT SAY, so that nobody looks for it here. This service publishes a host port
# (127.0.0.1:8082:8080) and mounts a blobs volume. The repository declaration owns public route
# metadata (`routes`, `upstream_port`, `host`, `navigation-entries`), but it still says nothing about
# host-port publication, volumes or environment. Those are run-args, and they live on the deployer's
# config volume, written by the bootstrap CLI. An unknown key here fails the deployment.

# STOP-FIRST, because this deployment publishes a host port. Under start-first the successor
# waits in Pending for a port the predecessor only frees by stopping — which start-first never
# does — so a one-node swarm deadlocks on the first rolling update. A single binder cannot have
# the lossless-rollback overlap; the deploy takes the brief gap instead. Measured live on
# qits-platform-mirror's 2026.813.163303 deploy, the first host-port update since the swarm
# cutover (2026-08-13).
update_order: stop-first
