# The image build, per push — moved from ci-post-receive.yml when this repo went domain-event-only,
# the switch qits-githost and qits-artifacts already made. `checkout:` makes it a move rather than a
# rewrite: the run builds the pushed branch at the pushed sha, but the pipeline is DISCOVERED at main,
# so a pushed branch can no longer alter the CI that gates it. suppressCi restates what the
# post-receive convention did with `-o qits.no-ci`. Separate from ci-event-userflows.yml on purpose:
# that run is non-gating, a red verify must not cost the image.
event: SCMPublishCommit
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match belongs on the name. The event echoes the public name the push was
  # addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-mirror-platform-service }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the qits-mirror-platform-frontend submodule
      # at src/main/webui arrives as an EMPTY DIRECTORY — and Quinoa fails the image build on exactly
      # that (`No package.json found in Web UI directory`). `submodule update --init` checks out the
      # gitlink this repository recorded, so the bundle is built from the client commit this commit
      # names. Initialising it here rather than asking the daemon to clone differently keeps the
      # submodule this repo's business: a public GitHub repo needing no credentials, one fetch.
      #
      # The url is derived from this run's own repository url rather than read from .gitmodules,
      # because the sibling lives beside this repository on whichever host CI cloned from.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-mirror-platform-frontend"
      git -c submodule.qits-mirror-platform-frontend.url="$frontend_url" submodule update --init src/main/webui

      cd src/main/webui
      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. npm pins a full
      # resolved URL per package and qits-mirror-platform-frontend's lockfile is generated on the
      # deployment host, so every entry names a localhost port that does not exist in this container.
      # `npm ci` fetches tarballs by those URLs and never asks the configured registry, so the
      # environment below does not reach them: without this swap the install dies on connection
      # refused. The paths are identical on every address, so replacing the ORIGIN and keeping the
      # path is all it takes, and the integrity hashes are what make that safe. The checkout is this
      # step's own; nothing is edited that anyone will read again.
      #
      # THE BYTE PLANE IS TWO SERVICES, WHICH IS WHY THE SWAP READS THE PATH. This service holds the
      # npmjs pull-through cache; qits-artifacts hosts the @qits scope. No single origin serves both,
      # so the path tells them apart: an entry under the hosted registry's own pathname
      # ($QITS_NPM_REGISTRY_URL's) is a @qits tarball and gets the hosted origin, everything else gets
      # the proxy's. THE ORDER OF THE TWO EXPRESSIONS IS THE TRICK — sed applies -e in sequence per
      # line, so the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits
      # entries after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for this, `--replace-registry-host=always`, cannot do it against a registry
      # mounted under a path: @npmcli/arborist glues rather than resolves, so the pathname ends up
      # doubled and every tarball 404s. Measured on npm 10.9.4.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-mirror-platform-frontend COMMITS an .npmrc
      # (mirror.dev.localhost:8080 for npmjs and registry.dev.localhost:8080 for @qits, right for a
      # developer on the host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a `cat >
      # ~/.npmrc` preamble would be written and silently ignored. npm_config_* environment outranks
      # both files, so it wins without touching the submodule tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-platform-spa-mirror/browser — the bundle the image build consumes (it is
      # quarkus.quinoa.build-dir in src/main/resources/application.properties) and the ONE artifact
      # this half exists to produce. Lint and test are qits-mirror-platform-frontend's own pipeline's job;
      # repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN, which is the only place it exists.
      # Unconditional on purpose: a missing env source is NOT an error — measured on buildx v0.36.1,
      # `--secret id=x,env=DOES_NOT_EXIST` builds green and the mounted variable is simply unset —
      # so these lines do nothing at all until a run carries the pair.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-mirror:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
